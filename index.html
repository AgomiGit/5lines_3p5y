            document.title = `${ticker} 投資決策儀表板`;

                yaxis: {gridcolor: '#f0f0f0', fixedrange: true},
                plot_bgcolor: '#ffffff',
                paper_bgcolor: '#ffffff'
            };
            Plotly.react(chartDiv, traces, layout, {scrollZoom: false, displayModeBar: false, responsive: true});
        }
